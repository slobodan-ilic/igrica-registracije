<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/plate.svg" />
    <!-- The map handles its own pinch, so the page no longer has to be locked
         against zooming. maximum-scale was ignored by iOS anyway, and on
         everything else it took page zoom away from people who need it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131519" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Pogodi kojem području pripada oznaka sa tablice. Šest zemalja, 310 oznaka, od Srbije do stare Jugoslavije."
    />
    <title>Registarske oznake · kviz</title>
    <!-- What a shared link shows. Every country and /dnevni get their own, written
         into their own HTML at build time by scripts/build-pages.mjs — a crawler
         does not run JavaScript, so React setting them later is invisible to it. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tablice.vercel.app/" />
    <meta property="og:title" content="Registarske oznake · kviz" />
    <meta
      property="og:description"
      content="Pogodi kojem području pripada oznaka sa tablice. Šest zemalja, 310 oznaka, od Srbije do stare Jugoslavije."
    />
    <meta property="og:image" content="https://tablice.vercel.app/api/og?t=srbija" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tablice.vercel.app/api/og?t=srbija" />
    <script>
      // Applied before render so a remembered dark theme never flashes light.
      try {
        var t = localStorage.getItem('tablice.theme')
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
